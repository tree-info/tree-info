<!doctype html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कण्हेर | झाडाची माहिती</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans Devanagari", sans-serif;
      color: #1b5e20;
      line-height: 1.75;
      background: #ffffff;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(to right, #0d0d0d, #b30000);
      color: #fff;
      padding: 28px 40px;
    }

    .header-container {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 30px;
    }

    .logo {
      text-align: center;
    }

    .logo img {
      height: 120px;
    }

    .udise {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .header-text {
      text-align: center;
    }

    .header-text h1 {
      font-size: 36px;
      margin: 0;
      font-weight: 700;
    }

    .header-text h2 {
      font-size: 24px;
      margin: 8px 0;
      font-weight: 600;
    }

    .header-text p {
      font-size: 18px;
      margin: 0;
    }

    .email {
      font-size: 16px;
      text-align: right;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .header-container {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .email { text-align: center; }
      .logo img { height: 95px; margin: auto; }
    }

    /* ===== BACKGROUND ===== */
    .main-wrapper {
      background:
        linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
        url("bg1.png");
      background-size: cover;
      background-position: center;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 22px;
    }

    /* ===== TREE TITLE ===== */
    .tree-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .tree-title h1 {
      font-size: 46px;
    }

    .tree-title p {
      font-size: 18px;
      color: #33691e;
    }

    .tree-image {
      width: 360px;
      height: 300px;
      margin: 28px auto;
      border-radius: 20px;
      background: linear-gradient(145deg, #e8f5e9, #c8e6c9);
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    .tree-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ===== SECTIONS ===== */
    section {
      background: linear-gradient(to bottom right, #ffffff, #f1fff3);
      padding: 32px;
      margin-bottom: 38px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    section h2 {
      border-bottom: 3px solid #81c784;
      padding-bottom: 12px;
      margin-bottom: 18px;
      font-size: 28px;
    }

    section p {
      text-align: justify;
    }

    /* ===== CARDS ===== */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      background: linear-gradient(to bottom right, #ffffff, #e8f5e9);
      padding: 22px;
      border-radius: 14px;
      border-left: 6px solid #2e7d32;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    /* ===== CIRCULAR CARDS ===== */
    .circular-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
    }

    .circular-card {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, #e8f5e9, #a5d6a7);
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      border: 6px solid #2e7d32;
    }

    .circular-card p {
      text-align: center;
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 22px;
      background: linear-gradient(to right, #2e7d32, #66bb6a);
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>

<body>

<header>
  <div class="header-container">
    <div class="logo">
      <img src="pm logo.png" alt="PM SHRI Logo">
      <div class="udise">UDISE : 27150107301</div>
    </div>

    <div class="header-text">
      <h1>पीएम श्री जिल्हा परिषद हायस्कूली,विष्णुपूरी नांदेड</h1>
      <h2>शिक्षक-शिक्षिका व शिक्षकेतर कर्मचारी वृंद</h2>
      <p>(शैक्षणिक वर्ष 2025–26)</p>
    </div>

    <div class="email">
      E-mail ID<br>
      <strong>zphsvishnupuri@gmail.com</strong>
    </div>
  </div>
</header>

<div class="main-wrapper">
<main>

</main>
</div>

<footer>
  © 2025–26 | झाडांची माहिती | PM SHRI ZP High School, Vishnupuri, Nanded
</footer>

</body>
</html>
