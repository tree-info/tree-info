<!doctype html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कण्हेर | झाडाची माहिती</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans Devanagari", sans-serif;
      color: #1b5e20;
      line-height: 1.75;
      background: #ffffff;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(to right, #0d0d0d, #b30000);
      color: #fff;
      padding: 28px 40px;
    }

    .header-container {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 30px;
    }

    .logo {
      text-align: center;
    }

    .logo img {
      height: 120px;
    }

    .udise {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .header-text {
      text-align: center;
    }

    .header-text h1 {
      font-size: 36px;
      margin: 0;
      font-weight: 700;
    }

    .header-text h2 {
      font-size: 24px;
      margin: 8px 0;
      font-weight: 600;
    }

    .header-text p {
      font-size: 18px;
      margin: 0;
    }

    .email {
      font-size: 16px;
      text-align: right;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .header-container {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .email { text-align: center; }
      .logo img { height: 95px; margin: auto; }
    }

    /* बाकीचा कोड जशास तसा */
  </style>
</head>

<body>

<header>
  <div class="header-container">
    <div class="logo">
      <img src="pm logo.png" alt="PM SHRI Logo">
      <div class="udise">UDISE : 27150107301</div>
    </div>

    <div class="header-text">
      <h1>पीएम श्री जिल्हा परिषद हायस्कूल, विष्णुपुरी नांदेड</h1>
      <h2>शिक्षक-शिक्षिका व शिक्षकेतर कर्मचारी वृंद</h2>
      <p>(शैक्षणिक वर्ष 2025–26)</p>
    </div>

    <div class="email">
      E-mail ID<br>
      <strong>zphsvishnupuri@gmail.com</strong>
    </div>
  </div>
</header>

</body>
</html>
